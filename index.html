<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SproutScript — Legal</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f8fb; color: #222; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 16px; }
    .logo { font-size: 3rem; margin-bottom: 8px; }
    h1 { font-size: 1.5rem; font-weight: 700; color: #2b6d90; margin-bottom: 4px; }
    .subtitle { font-size: 0.88rem; color: #666; margin-bottom: 40px; }
    .cards { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 420px; }
    .card { background: #fff; border-radius: 14px; padding: 20px 22px; box-shadow: 0 1px 6px rgba(0,0,0,0.08); text-decoration: none; display: flex; align-items: center; gap: 16px; transition: box-shadow 0.15s; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
    .card-icon { font-size: 2rem; flex-shrink: 0; }
    .card-text strong { display: block; font-size: 1rem; color: #222; margin-bottom: 2px; }
    .card-text span { font-size: 0.82rem; color: #666; }
    footer { margin-top: 48px; font-size: 0.78rem; color: #aaa; }
  </style>
</head>
<body>
  <div class="logo">🌱</div>
  <h1>SproutScript</h1>
  <p class="subtitle">Childminding management app · Legal documents</p>

  <div class="cards">
    <a href="privacy.html" class="card">
      <span class="card-icon">🔒</span>
      <div class="card-text">
        <strong>Privacy Policy</strong>
        <span>How we collect, use and protect your data · UK GDPR compliant</span>
      </div>
    </a>
    <a href="terms.html" class="card">
      <span class="card-icon">📋</span>
      <div class="card-text">
        <strong>Terms of Service</strong>
        <span>Rules for using SproutScript · England &amp; Wales law</span>
      </div>
    </a>
  </div>

  <footer>Questions? <a href="mailto:SproutScriptApp@gmail.com" style="color:#5BA8D0">SproutScriptApp@gmail.com</a></footer>
</body>
</html>
